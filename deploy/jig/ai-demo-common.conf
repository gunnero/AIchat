# Included inside the ai.igurl.dk VirtualHost only.
DocumentRoot /home/igurl/domains/ai.igurl.dk/public_html
DirectoryIndex index.html
ErrorLog /var/log/virtualmin/ai.igurl.dk_error_log
CustomLog /var/log/virtualmin/ai.igurl.dk_access_log combined

<Directory /home/igurl/domains/ai.igurl.dk/public_html>
    Options -Indexes -Includes -ExecCGI +SymLinksIfOwnerMatch
    AllowOverride None
    Require all granted
    <FilesMatch "(^\.|\.(php|phtml|phar|cgi|pl|py|sh|env|map)$)">
        Require all denied
    </FilesMatch>
</Directory>

Alias /.well-known/acme-challenge/ /home/igurl/domains/ai.igurl.dk/acme/.well-known/acme-challenge/
<Directory /home/igurl/domains/ai.igurl.dk/acme/.well-known/acme-challenge>
    Options None
    AllowOverride None
    Require all granted
</Directory>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set X-Robots-Tag "noindex, nofollow, noarchive"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
Header always set Cache-Control "no-cache"
<Location /assets/>
    Header always set Cache-Control "public, max-age=31536000, immutable"
</Location>
AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json
