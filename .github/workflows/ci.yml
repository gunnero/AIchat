name: App checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:sites
      - name: Verify production guard
        run: |
          if npm run build:production > production-guard.log 2>&1; then
            cat production-guard.log
            echo "Unexpected production build success"
            exit 1
          fi
          grep -q "Production is not implemented" production-guard.log
