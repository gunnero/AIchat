# Include only inside the ai.igurl.dk HTTPS vhost.
ProxyPreserveHost On
# Rate-limit identity: discard supplied chains and use the TCP connection peer.
# Enable APACHE_CLIENT_IP=1 only with this vhost contract in place.
ProxyAddHeaders Off
RequestHeader unset X-Forwarded-For
RequestHeader set X-Forwarded-For "expr=%{CONN_REMOTE_ADDR}"
# Let the exact no-slash paths reach their canonical RedirectMatch rules before
# the root catch-all proxy. Keep all actual backoffice subpaths proxied.
ProxyPassMatch "^/(?:backoffice|demo)$" "!"
ProxyPass /.well-known/acme-challenge/ !
ProxyPass /demo/ !
ProxyPass /backoffice/ http://127.0.0.1:8765/backoffice/ connectiontimeout=5 timeout=25
ProxyPassReverse /backoffice/ http://127.0.0.1:8765/backoffice/
RedirectMatch 302 ^/backoffice$ /backoffice/
RedirectMatch 302 ^/demo$ /demo/
Alias /demo/ /home/igurl/domains/ai.igurl.dk/demo_current/
<Directory /home/igurl/domains/ai.igurl.dk/demo_current>
    Options -Indexes -Includes -ExecCGI +SymLinksIfOwnerMatch
    AllowOverride None
    Require all granted
    <FilesMatch "(^\.|\.(php|phtml|phar|cgi|pl|py|sh|env|map)$)">
        Require all denied
    </FilesMatch>
</Directory>
ProxyPass / http://127.0.0.1:8765/ connectiontimeout=5 timeout=25
ProxyPassReverse / http://127.0.0.1:8765/

# First-owner enrollment must never be proxied from the public site.
<LocationMatch "^/backoffice/api/setup(?:/|$)">
    Require all denied
</LocationMatch>
<LocationMatch "^/(?!demo(?:/|$)|\.well-known/acme-challenge/)">
    Header onsuccess unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "no-referrer"
</LocationMatch>
<Location /demo/assets/>
    Header always set Cache-Control "public, max-age=31536000, immutable"
</Location>
