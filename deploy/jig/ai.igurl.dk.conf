# Install after the ai.igurl.dk certificate has been issued.
<VirtualHost *:80>
    ServerName ai.igurl.dk
    Include /etc/apache2/ai-demo-common.conf
    RewriteEngine On
    RewriteRule ^/?(?!\.well-known/acme-challenge/)(.*)$ https://ai.igurl.dk/$1 [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName ai.igurl.dk
    Include /etc/apache2/ai-demo-common.conf
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/ai.igurl.dk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ai.igurl.dk/privkey.pem
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    Protocols h2 http/1.1
    Header always set Strict-Transport-Security "max-age=86400"
</VirtualHost>
