# Include only inside the ai.igurl.dk HTTPS vhost. The public demo is unchanged.
ProxyPreserveHost On
ProxyPass /backoffice/ http://127.0.0.1:8765/backoffice/ connectiontimeout=5 timeout=25
ProxyPassReverse /backoffice/ http://127.0.0.1:8765/backoffice/
RedirectMatch 302 ^/backoffice$ /backoffice/

# First-owner enrollment must never be proxied from the public site.
<LocationMatch "^/backoffice/api/setup(?:/|$)">
    Require all denied
</LocationMatch>
<Location /backoffice/>
    Header onsuccess unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "no-referrer"
</Location>
