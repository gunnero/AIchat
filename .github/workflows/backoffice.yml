name: Backoffice checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ai_migrator:synthetic-ci-only@127.0.0.1:5432/ai_customer
      TEST_RESTORE_DATABASE_URL: postgresql://ai_migrator:synthetic-ci-only@127.0.0.1:5432/ai_restore
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: backoffice/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Prepare isolated PostgreSQL roles and matching backup clients
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < tests/postgres-ci.sql
          cat > "$RUNNER_TEMP/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            if [[ "$arg" == --file=* ]]; then output="${arg#--file=}"; else args+=("$arg"); fi
          done
          docker exec "$PG_CONTAINER" pg_dump "${args[@]}" > "$output"
          SH
          cat > "$RUNNER_TEMP/pg_restore" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          input="${@: -1}"
          args=("${@:1:$#-1}")
          docker exec -i "$PG_CONTAINER" pg_restore "${args[@]}" < "$input"
          SH
          chmod 700 "$RUNNER_TEMP/pg_dump" "$RUNNER_TEMP/pg_restore"
          echo "PG_DUMP=$RUNNER_TEMP/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE=$RUNNER_TEMP/pg_restore" >> "$GITHUB_ENV"
          echo "PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
